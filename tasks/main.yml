---
# tasks file for locales

# https://stackoverflow.com/questions/52421542/ansible-debconf-module-not-working-properly-to-set-default-locale
#
# So for now we use locale_gen module to generate locales and a template to
# replace the default locale in /etc/default/locale (debian < 13) or
# /etc/locale.conf (Debian >= 13)

- name: Package
  ansible.builtin.package:
    name: locales
  tags:
    - locales
    - package

- name: Generate
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ locale_gen }}"
  when: locale_gen is defined
  tags:
    - locales
    - gen

- name: Default
  ansible.builtin.template:
    src: default.j2
    dest: /etc/default/locale
    mode: "0644"
  when:
    - locale_default is defined
    - ansible_distribution_major_version is version_compare('13', '<')
  tags:
    - locales
    - default

- name: Default
  ansible.builtin.template:
    src: default.j2
    dest: /etc/locale.conf
    mode: "0644"
  when:
    - locale_default is defined
    - ansible_distribution_major_version is version_compare('13', '>=')
  tags:
    - locales
    - default
